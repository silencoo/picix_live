[project]
name = "picix-live"
version = "2.1.0"
description = "Picix automation helper and Telegram bot"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "python-telegram-bot[job-queue]>=22.5,<23",
    "requests>=2.32.5,<3",
]

[project.scripts]
picix = "picix_bot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["picix_bot"]
